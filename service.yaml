    - ZDP-REPO-MARKDOWN-001
    - ZDP-XCUT-SECHEADER-001

human_review_required:
  - auth provider list changes
  - passkey UI flow changes
  - account recovery wording
  - redirect or callback surface changes
  - package release

exit:
  success_criteria:
    - Astro, SvelteKit, and Tauri Svelte surfaces can share auth UI without copying login forms
    - active Korean and English copy stay behind message keys
    - 12-locale target contract is visible before translation expansion
    - auth UI does not own identity, credential, token, session, permission, consent, payment, or audit truth
  kill_criteria:
    - auth UI stores or verifies credentials, tokens, passkey challenges, or OAuth provider payloads
    - auth UI calls core datastores directly
    - product-specific signup policies move into this package
  sunset_plan: null
  owner: 0disoft
  review_at: null
  user_notice_days: null
  data_export_window_days: null
  dependency_removal_checklist:
    - remove auth UI package imports from consumers
    - keep zdp-core-platform auth endpoints authoritative
    - archive locale and provider UI decisions

notes:
  - This repository is a shared auth UI package, not an identity service.
  - It uses Svelte components so Astro can consume it as islands and SvelteKit/Tauri Svelte can consume it directly.
  - Korean and English are active first; Chinese, Spanish, French, Hindi, Japanese, Vietnamese, Russian, Indonesian, Malay, and Thai are planned.
  - Consuming deployments must apply auth UI security headers including Content-Security-Policy, Strict-Transport-Security, X-Content-Type-Options, Referrer-Policy, Permissions-Policy, and frame-ancestors or X-Frame-Options. CSP unsafe-inline and unsafe-eval require a nonce, hash, or reviewed exception.
  - CI checks out only zdp-auth-ui, resolves published zdp-design-system from npm, then runs bun run build and bun run check.
