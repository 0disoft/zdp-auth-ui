name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      integrity: ${{ steps.package_artifact.outputs.integrity }}
      manifest: ${{ steps.package_artifact.outputs.manifest }}
      tarball: ${{ steps.package_artifact.outputs.tarball }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Release tag must point to a commit contained in origin/main."
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Verify npm trusted publishing support
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (![major, minor, patch].every(Number.isInteger) || major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error(`npm ${process.argv[1]} does not support trusted publishing; npm 11.5.1 or later is required.`);
            }
          ' "$npm_version"

      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Verify package
        run: bun run check

      - name: Verify browser behavior
        run: bun run browser:check

      - name: Build package artifact
        id: package_artifact
        run: bun scripts/build-release-artifact.ts --git-head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          node --input-type=commonjs <<'NODE' > release-notes.md
          const fs = require("node:fs");
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8").replace(/\r\n/g, "\n");
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const startMatch = changelog.match(new RegExp(`^##\\s+${escapedVersion}\\b.*$`, "m"));
          if (!startMatch || startMatch.index === undefined) {
            throw new Error(`CHANGELOG.md does not contain a ${version} release section.`);
          }
          const start = startMatch.index;
          const next = changelog.slice(start + startMatch[0].length).search(/^##\s+/m);
          const end = next === -1 ? changelog.length : start + startMatch[0].length + next;
          process.stdout.write(changelog.slice(start, end).trim() + "\n");
          NODE

      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-npm-release
          path: |
            ${{ steps.package_artifact.outputs.tarball }}
            ${{ steps.package_artifact.outputs.manifest }}
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-npm-release

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify npm trusted publishing support
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (![major, minor, patch].every(Number.isInteger) || major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error(`npm ${process.argv[1]} does not support trusted publishing; npm 11.5.1 or later is required.`);
            }
          ' "$npm_version"

      - name: Verify release artifact identity
        env:
          RELEASE_MANIFEST: ${{ needs.prepare.outputs.manifest }}
          RELEASE_TARBALL: ${{ needs.prepare.outputs.tarball }}
          RELEASE_INTEGRITY: ${{ needs.prepare.outputs.integrity }}
        run: |
          node --input-type=commonjs <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const manifestPath = process.env.RELEASE_MANIFEST;
          const tarballPath = process.env.RELEASE_TARBALL;
          if (path.basename(manifestPath) !== manifestPath || path.basename(tarballPath) !== tarballPath) {
            throw new Error("Release artifact paths must be basenames.");
          }
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const integrity = `sha512-${crypto.createHash("sha512").update(fs.readFileSync(tarballPath)).digest("base64")}`;
          if (manifest.schemaVersion !== "zdp.npm-release-artifact/v1" || manifest.gitHead !== process.env.GITHUB_SHA || manifest.tarball !== tarballPath || manifest.integrity !== integrity || integrity !== process.env.RELEASE_INTEGRITY) {
            throw new Error("Downloaded release artifact identity or integrity does not match the prepared output.");
          }
          NODE

      - name: Check npm registry state
        id: npm_state
        run: |
          package_name="$(node -p "require('./${{ needs.prepare.outputs.manifest }}').package")"
          package_version="$(node -p "require('./${{ needs.prepare.outputs.manifest }}').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify existing npm source anchor
        if: steps.npm_state.outputs.already_published == 'true'
        run: |
          package_name="$(node -p "require('./${{ needs.prepare.outputs.manifest }}').package")"
          package_version="$(node -p "require('./${{ needs.prepare.outputs.manifest }}').version")"
          published_git_head="$(npm view "${package_name}@${package_version}" gitHead 2>/dev/null || true)"
          if [ "$published_git_head" != "$GITHUB_SHA" ]; then
            echo "::error::Published npm gitHead ${published_git_head:-unavailable} does not match release tag SHA ${GITHUB_SHA}."
            exit 1
          fi

      - name: Publish package
        if: steps.npm_state.outputs.already_published != 'true'
        run: npm publish "${{ needs.prepare.outputs.tarball }}" --access public

      - name: Verify npm registry result
        run: |
          package_name="$(node -p "require('./${{ needs.prepare.outputs.manifest }}').package")"
          package_version="$(node -p "require('./${{ needs.prepare.outputs.manifest }}').version")"
          max_attempts=60
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            published_version="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
            published_git_head="$(npm view "${package_name}@${package_version}" gitHead 2>/dev/null || true)"
            published_integrity="$(npm view "${package_name}@${package_version}" dist.integrity 2>/dev/null || true)"
            if [ "$published_version" = "$package_version" ] && [ "$published_git_head" = "$GITHUB_SHA" ] && [ "$published_integrity" = "${{ needs.prepare.outputs.integrity }}" ]; then
              npm view "${package_name}@${package_version}" dist.tarball
              exit 0
            fi

            if [ "$published_version" = "$package_version" ] && [ -n "$published_git_head" ] && [ "$published_git_head" != "$GITHUB_SHA" ]; then
              echo "::error::Published npm gitHead ${published_git_head} does not match release tag SHA ${GITHUB_SHA}."
              exit 1
            fi

            if [ "$published_version" = "$package_version" ] && [ -n "$published_integrity" ] && [ "$published_integrity" != "${{ needs.prepare.outputs.integrity }}" ]; then
              echo "::error::Published npm integrity ${published_integrity} does not match packed artifact integrity ${{ needs.prepare.outputs.integrity }}."
              exit 1
            fi

            echo "npm version/source metadata is not ready for ${package_name}@${package_version}; retrying (${attempt}/${max_attempts})."
            sleep 5
            attempt=$((attempt + 1))
          done

          echo "::error::npm did not expose ${package_name}@${package_version} after ${max_attempts} attempts."
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: ${{ needs.prepare.outputs.manifest }}
          RELEASE_TARBALL: ${{ needs.prepare.outputs.tarball }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_assets="$(mktemp -d)"
            trap 'rm -rf "$release_assets"' EXIT
            gh release download "$GITHUB_REF_NAME" \
              --pattern "$RELEASE_TARBALL" \
              --pattern "$RELEASE_MANIFEST" \
              --dir "$release_assets"
            cmp "$RELEASE_TARBALL" "$release_assets/$RELEASE_TARBALL"
            cmp "$RELEASE_MANIFEST" "$release_assets/$RELEASE_MANIFEST"
            echo "Release ${GITHUB_REF_NAME} and its package assets already exist and match."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_TARBALL#npm package tarball" \
            "$RELEASE_MANIFEST#npm release artifact manifest" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
