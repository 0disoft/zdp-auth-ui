name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-ui-package:
    name: auth-ui-package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: projects/zdp-platforms/client-surfaces/zdp-auth-ui

    steps:
      - name: Checkout auth UI
        uses: actions/checkout@v7
        with:
          path: projects/zdp-platforms/client-surfaces/zdp-auth-ui

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install auth UI dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check
        run: bun run check

      - name: Check browser accessibility
        run: bun run browser:check
