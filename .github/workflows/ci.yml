name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-ui-package:
    name: auth-ui-package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: projects/zdp-platforms/client-surfaces/zdp-auth-ui

    steps:
      - name: Checkout auth UI
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: projects/zdp-platforms/client-surfaces/zdp-auth-ui
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install auth UI dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check
        run: bun run check

      - name: Check browser accessibility
        run: bun run browser:check
